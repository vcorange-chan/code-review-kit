name: Check portable tool and skill
on: [push, pull_request, workflow_dispatch]
env:
  # CI receives no real private terms. Local push/publish gates use the private policy.
  REVIEW_KIT_PRIVATE_TERMS: '[]'
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python scripts/check_release.py source
      - run: python -m pip install .
      - run: code-review doctor
      - run: python -m unittest discover -s tests -v
      - run: node --check reviewkit/templates/review.js
      - run: node --check reviewkit/templates/lecture.js
      - run: node --check reviewkit/templates/research.js
      - run: python scripts/build_dist.py
      - run: python scripts/smoke_skill.py
      - uses: actions/upload-artifact@v4
        with:
          name: skill-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*-skill.zip
  pi-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global --ignore-scripts @earendil-works/pi-coding-agent
      - run: pi install --local .
      - run: pi list
  privacy-release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_release.py source --require-private-terms
      - run: python -m pip install .
      - run: python scripts/prepare_release.py --out dist/release
      - run: python scripts/prepare_release.py --out dist/release --verify
      - uses: actions/upload-artifact@v4
        with:
          name: checked-release-assets
          path: dist/release/*
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install .
      - run: code-review business --manifest examples/document-pipeline/business.json --explanations examples/document-pipeline/explanations.json --out out/document-pipeline --depth 0 --max-nodes 64
      - run: code-review business --manifest examples/document-pipeline/business.json --explanations examples/document-pipeline/explanations.en.json --output-language en --out out/document-pipeline-en --depth 0 --max-nodes 64
      - run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: node scripts/capture_demo.mjs out/document-pipeline/index.html out/preview/review-example.png
      - run: node scripts/capture_demo.mjs out/document-pipeline-en/index.html out/preview/review-example-en.png
      - run: python scripts/build_research_demo.py --out out/research-demo
      - run: node scripts/check_research_ui.mjs out/research-demo/personal.html out/preview/research-example.png
      - uses: actions/upload-artifact@v4
        with:
          name: public-demo-preview
          path: out/preview/*.png
