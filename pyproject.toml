[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-kit"
version = "0.2.0"
description = "Local source evidence and reusable business-flow review HTML"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["ast-grep-py==0.51.0"]

[project.scripts]
code-review = "reviewkit.cli:main"

[tool.setuptools.packages.find]
include = ["reviewkit*"]

[tool.setuptools.package-data]
reviewkit = ["templates/*.html", "templates/*.css", "templates/*.js"]
